<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zathura.AI — Procurement Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
  :root{
    --primary:#4d7df3; --primary-dark:#2f63e8; --primary-deep:#1e3a8a;
    --text:#0f172a; --muted:#64748b; --faint:#94a3b8; --line:#e5e7eb;
    --bg:#f6f8fc; --card:#ffffff; --soft:#f8fafc;
    --success:#16a34a; --success-bg:#ecfdf3; --success-line:#bbf7d0;
    --warning:#b45309; --warning-bg:#fffbeb; --warning-line:#fde68a;
    --danger:#dc2626; --danger-bg:#fef2f2; --danger-line:#fecaca;
    --info-bg:#eef3ff;
    --radius:16px; --radius-sm:10px; --radius-lg:22px;
    --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 1px rgba(15,23,42,.03);
    --shadow-lg:0 18px 44px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;
    color:var(--text); background:var(--bg); line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Sora',sans-serif; letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;}

  /* ===== layout ===== */
  #app{display:flex; min-height:100vh;}
  .sidebar{
    width:252px; flex:0 0 252px; background:#0f1830; color:#e2e8f7;
    display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  }
  .sidebar-brand{padding:22px 20px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-brand .mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--primary),#8a6df9);
    display:flex;align-items:center;justify-content:center; font-family:'Sora'; font-weight:800; color:#fff; font-size:15px; flex:0 0 auto;
  }
  .sidebar-brand .name{font-family:'Sora'; font-weight:800; font-size:16px; color:#fff;}
  .sidebar-brand .sub{font-size:10.5px; color:#94a3c4; letter-spacing:.04em; text-transform:uppercase; font-weight:600;}
  .sidebar-back{padding:10px 20px; font-size:12px; color:#8da0c9; border-bottom:1px solid rgba(255,255,255,.08);}
  .sidebar-back:hover{color:#fff;}
  .nav-group{padding:14px 12px;}
  .nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:#5f7299; font-weight:700; padding:10px 10px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:10px;
    color:#c4d0ec; font-size:14px; font-weight:500; cursor:pointer; transition:background .15s,color .15s; margin-bottom:2px;
  }
  .nav-item i{width:16px; text-align:center; color:#7c8db8; font-size:14px;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 6px 16px rgba(77,125,243,.35);}
  .nav-item.active i{color:#fff;}
  .nav-badge{margin-left:auto; background:rgba(255,255,255,.14); padding:1px 8px; border-radius:999px; font-size:11px; font-weight:700;}
  .nav-item.active .nav-badge{background:rgba(255,255,255,.25);}
  .nav-badge.danger{background:var(--danger); color:#fff;}
  .sidebar-foot{margin-top:auto; padding:14px 20px; border-top:1px solid rgba(255,255,255,.08); font-size:11.5px; color:#5f7299;}
  .sidebar-foot button{background:none; border:none; color:#7c8db8; font-size:11.5px; padding:0; text-decoration:underline; text-underline-offset:2px;}
  .sidebar-foot button:hover{color:#fff;}

  .main{flex:1; min-width:0; padding:32px 38px 60px;}
  .page-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
  .page-head h1{font-size:25px; font-weight:800;}
  .page-head p{color:var(--muted); font-size:14px; margin-top:4px; max-width:620px;}
  .eyebrow{display:inline-flex; align-items:center; gap:7px; padding:5px 11px; border:1px solid rgba(77,125,243,.22); border-radius:999px; color:var(--primary-dark); background:rgba(77,125,243,.07); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:10px;}

  /* ===== buttons ===== */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 18px; border-radius:10px; border:1.5px solid transparent; font-size:13.5px; font-weight:600; transition:.15s;}
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 8px 20px rgba(77,125,243,.30);}
  .btn-secondary{background:#fff; border-color:var(--line); color:var(--text);}
  .btn-secondary:hover{border-color:var(--primary); color:var(--primary);}
  .btn-ghost{background:transparent; border-color:transparent; color:var(--muted); height:36px; padding:0 10px;}
  .btn-ghost:hover{color:var(--text); background:var(--soft);}
  .btn-success{background:var(--success); color:#fff;}
  .btn-danger{background:#fff; border-color:var(--danger-line); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-bg);}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none;}
  .btn-sm{height:34px; padding:0 13px; font-size:12.5px; border-radius:9px;}

  /* ===== cards/grid ===== */
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);}
  .pad{padding:22px;}
  .grid{display:grid; gap:16px;}
  .kpi-row{grid-template-columns:repeat(4,1fr);}
  .kpi{padding:20px 20px 18px;}
  .kpi .label{font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; display:flex; align-items:center; gap:7px;}
  .kpi .value{font-family:'Sora'; font-size:30px; font-weight:800; margin-top:8px;}
  .kpi .delta{font-size:12px; margin-top:6px; color:var(--muted);}
  .kpi .icon-badge{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;}

  @media (max-width:1180px){.kpi-row{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:760px){#app{flex-direction:column;} .sidebar{position:relative; width:100%; height:auto;} .main{padding:22px;} .kpi-row{grid-template-columns:1fr;}}

  /* ===== badges ===== */
  .badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:700; white-space:nowrap;}
  .badge.b-success{background:var(--success-bg); color:var(--success); border:1px solid var(--success-line);}
  .badge.b-warning{background:var(--warning-bg); color:var(--warning); border:1px solid var(--warning-line);}
  .badge.b-danger{background:var(--danger-bg); color:var(--danger); border:1px solid var(--danger-line);}
  .badge.b-info{background:var(--info-bg); color:var(--primary-dark); border:1px solid rgba(77,125,243,.22);}
  .badge.b-neutral{background:var(--soft); color:var(--muted); border:1px solid var(--line);}
  .badge.b-dot::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor;}

  /* ===== tables ===== */
  table{width:100%; border-collapse:collapse;}
  .table-card{overflow-x:auto;}
  th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:700; padding:12px 16px; border-bottom:1px solid var(--line); white-space:nowrap;}
  td{padding:14px 16px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s;}
  tbody tr.clickable{cursor:pointer;}
  tbody tr.clickable:hover{background:var(--soft);}
  .cell-strong{font-weight:700;}
  .cell-muted{color:var(--muted); font-size:12.5px;}

  /* ===== forms ===== */
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--text); margin-bottom:6px;}
  .field .hint{font-size:11.5px; color:var(--faint); margin-top:5px;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field select,.field textarea{
    width:100%; height:42px; padding:0 13px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--text); transition:border-color .15s;
  }
  .field textarea{height:auto; padding:11px 13px; resize:vertical; min-height:80px;}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none; border-color:var(--primary);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:680px){.field-row{grid-template-columns:1fr;}}
  .checkbox-row{display:flex; align-items:flex-start; gap:10px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:13px;}
  .checkbox-row input{margin-top:3px;}
  .checkbox-row .ct{font-size:13px; font-weight:600;}
  .checkbox-row .cd{font-size:12px; color:var(--muted); margin-top:2px;}

  /* ===== steps ===== */
  .steps{display:flex; gap:8px; margin-bottom:26px; flex-wrap:wrap;}
  .step{display:flex; align-items:center; gap:9px; padding:9px 16px 9px 10px; border-radius:999px; background:#fff; border:1px solid var(--line); font-size:12.5px; font-weight:700; color:var(--faint);}
  .step .num{width:22px;height:22px;border-radius:50%; background:var(--soft); color:var(--faint); display:flex; align-items:center; justify-content:center; font-size:11px;}
  .step.active{border-color:var(--primary); color:var(--primary-dark); background:var(--info-bg);}
  .step.active .num{background:var(--primary); color:#fff;}
  .step.done{color:var(--success);}
  .step.done .num{background:var(--success); color:#fff;}

  /* ===== quotation comparison ===== */
  .quote-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:18px 0;}
  @media (max-width:900px){.quote-grid{grid-template-columns:1fr;}}
  .quote-card{border:2px solid var(--line); border-radius:var(--radius); padding:18px; cursor:pointer; transition:.15s; position:relative; background:#fff;}
  .quote-card:hover{border-color:#c7d6fb;}
  .quote-card.selected{border-color:var(--primary); box-shadow:0 0 0 4px rgba(77,125,243,.12);}
  .quote-card.lowest::after{content:"Lowest price"; position:absolute; top:-11px; left:16px; background:var(--success); color:#fff; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:999px;}
  .quote-vname{font-family:'Sora'; font-weight:700; font-size:15px; margin-bottom:3px;}
  .quote-price{font-family:'Sora'; font-size:24px; font-weight:800; margin:10px 0 2px;}
  .quote-meta{font-size:12px; color:var(--muted); display:flex; flex-direction:column; gap:4px; margin-top:10px;}
  .quote-meta span i{width:14px; color:var(--faint); margin-right:5px;}
  .quote-radio{position:absolute; top:16px; right:16px; width:19px; height:19px; border-radius:50%; border:2px solid var(--line); background:#fff;}
  .quote-card.selected .quote-radio{border-color:var(--primary); background:var(--primary); box-shadow:inset 0 0 0 3px #fff;}

  /* ===== AI console ===== */
  .console{
    background:#0c1226; border-radius:var(--radius-lg); padding:22px 22px 8px; margin:20px 0;
    border:1px solid #1c2647; box-shadow:var(--shadow-lg);
  }
  .console-head{display:flex; align-items:center; gap:10px; padding-bottom:16px; margin-bottom:10px; border-bottom:1px solid #1c2647;}
  .console-dot{width:9px;height:9px;border-radius:50%; background:var(--primary); box-shadow:0 0 0 3px rgba(77,125,243,.25);}
  .console-title{font-family:'JetBrains Mono'; color:#dce4f7; font-size:12.5px; font-weight:600;}
  .console-sub{font-family:'JetBrains Mono'; color:#5d6c93; font-size:11px; margin-left:auto;}
  .check-row{display:flex; align-items:flex-start; gap:11px; padding:8px 6px; border-radius:8px; opacity:0; transform:translateY(4px); animation:rowIn .35s ease forwards; animation-delay:calc(var(--i) * 70ms);}
  @keyframes rowIn{to{opacity:1; transform:translateY(0);}}
  .check-icon{width:19px;height:19px;border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:10px; margin-top:1px;}
  .check-icon.pass{background:rgba(22,163,74,.18); color:#4ade80;}
  .check-icon.warning{background:rgba(217,119,6,.18); color:#fbbf24;}
  .check-icon.fail{background:rgba(220,38,38,.2); color:#f87171;}
  .check-body{flex:1; min-width:0;}
  .check-top{display:flex; align-items:center; gap:9px; flex-wrap:wrap;}
  .check-name{font-family:'JetBrains Mono'; font-size:12.5px; color:#e7ecf9; font-weight:500;}
  .check-tag{font-family:'JetBrains Mono'; font-size:9.5px; color:#5d6c93; text-transform:uppercase; letter-spacing:.04em; border:1px solid #232f57; padding:1px 6px; border-radius:5px;}
  .check-crit{font-family:'JetBrains Mono'; font-size:9.5px; color:#fca5a5; border:1px solid #4a2330; background:rgba(220,38,38,.12); padding:1px 6px; border-radius:5px;}
  .check-note{font-family:'JetBrains Mono'; font-size:11.5px; color:#7e8bb0; margin-top:2px; line-height:1.5;}
  .console-progress{height:3px; background:#1c2647; border-radius:99px; overflow:hidden; margin:14px 0 18px;}
  .console-progress-bar{height:100%; background:linear-gradient(90deg,var(--primary),#8a6df9); width:0%; transition:width 2s cubic-bezier(.2,.7,.3,1);}

  .verdict{margin:10px 0 18px; border-radius:var(--radius); padding:20px; opacity:0; transform:translateY(8px); transition:opacity .4s, transform .4s;}
  .verdict.show{opacity:1; transform:translateY(0);}
  .verdict.approved{background:var(--success-bg); border:1px solid var(--success-line);}
  .verdict.rejected{background:var(--danger-bg); border:1px solid var(--danger-line);}
  .verdict.manual_review{background:var(--warning-bg); border:1px solid var(--warning-line);}
  .verdict-top{display:flex; align-items:center; gap:12px;}
  .verdict-icon{width:42px;height:42px;border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:18px; flex:0 0 auto;}
  .verdict.approved .verdict-icon{background:var(--success); color:#fff;}
  .verdict.rejected .verdict-icon{background:var(--danger); color:#fff;}
  .verdict.manual_review .verdict-icon{background:var(--warning); color:#fff;}
  .verdict-title{font-family:'Sora'; font-weight:800; font-size:17px;}
  .verdict.approved .verdict-title{color:#15803d;}
  .verdict.rejected .verdict-title{color:#b91c1c;}
  .verdict.manual_review .verdict-title{color:#92400e;}
  .verdict-conf{font-size:12px; color:var(--muted); margin-top:1px;}
  .verdict-text{font-size:13.5px; color:#334155; margin-top:12px; line-height:1.6;}
  .verdict-stats{display:flex; gap:18px; margin-top:14px; flex-wrap:wrap;}
  .verdict-stat{font-size:12px; color:var(--muted);}
  .verdict-stat b{color:var(--text); font-family:'JetBrains Mono';}

  /* ===== detail page ===== */
  .detail-grid{display:grid; grid-template-columns:1.6fr 1fr; gap:20px; align-items:start;}
  @media (max-width:980px){.detail-grid{grid-template-columns:1fr;}}
  .info-list{display:grid; grid-template-columns:1fr 1fr; gap:14px 20px;}
  .info-item .il{font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--faint); font-weight:700; margin-bottom:3px;}
  .info-item .iv{font-size:13.5px; font-weight:600;}
  .section-h{font-family:'Sora'; font-size:14px; font-weight:700; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .timeline{display:flex; flex-direction:column; gap:0;}
  .tl-item{display:flex; gap:12px; padding-bottom:18px; position:relative;}
  .tl-item:not(:last-child)::before{content:""; position:absolute; left:8px; top:20px; bottom:0; width:1.5px; background:var(--line);}
  .tl-dot{width:17px;height:17px;border-radius:50%; background:var(--info-bg); border:2px solid var(--primary); flex:0 0 auto; margin-top:2px;}
  .tl-body .tt{font-size:13px; font-weight:700;}
  .tl-body .tm{font-size:11.5px; color:var(--muted); margin-top:2px;}
  .tl-body .ts{font-size:10.5px; color:var(--faint); font-family:'JetBrains Mono'; margin-top:4px;}

  .checklist-static .check-row{animation:none; opacity:1; transform:none;}
  .checklist-static{background:#0c1226; border-radius:var(--radius); padding:14px 16px;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--muted);}
  .empty-state i{font-size:34px; color:var(--faint); margin-bottom:14px;}
  .empty-state h3{font-family:'Sora'; font-size:16px; color:var(--text); margin-bottom:6px;}

  .filter-bar{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .filter-chip{padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:12.5px; font-weight:600; color:var(--muted); cursor:pointer; transition:.15s;}
  .filter-chip:hover{border-color:var(--primary); color:var(--primary);}
  .filter-chip.active{background:var(--text); color:#fff; border-color:var(--text);}

  .progress-bar{height:8px; background:var(--soft); border-radius:99px; overflow:hidden; border:1px solid var(--line);}
  .progress-bar-fill{height:100%; border-radius:99px;}

  .toast-wrap{position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px;}
  .toast{background:var(--text); color:#fff; padding:13px 18px; border-radius:10px; font-size:13px; font-weight:600; box-shadow:var(--shadow-lg); display:flex; align-items:center; gap:10px; animation:toastIn .25s ease;}
  @keyframes toastIn{from{opacity:0; transform:translateX(20px);} to{opacity:1; transform:translateX(0);}}
  .toast i{color:#4ade80;}

  .reviewer-box{background:var(--soft); border:1px solid var(--line); border-radius:var(--radius); padding:16px;}
  .vendor-cat-head{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
  .vendor-cat-head:first-child{margin-top:0;}
  .scroll-x{overflow-x:auto;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   ZATHURA.AI — PROCUREMENT INTELLIGENCE
   Single-file simulated backend: department procurement requests, vendor
   quotations, SAP Ariba sync representation, and an AI validation agent
   that runs a 25-point checklist to auto-approve, auto-reject, or route
   requests to the human procurement team for manual review.

   Data persists via window.storage as SHARED data — every person who opens
   this app sees the same organization-wide workspace (vendors, requests,
   budgets), simulating a real shared company backend.
   ========================================================================= */

/* ---------------------------- reference data ---------------------------- */

const DEPARTMENTS = [
  {id:'IT',  name:'IT Department',          icon:'fa-server',        categories:['IT Hardware & Software','Cloud & SaaS Subscriptions']},
  {id:'COM', name:'Commercial Department',  icon:'fa-handshake',     categories:['Marketing & Commercial Services','Logistics & Packaging']},
  {id:'LEG', name:'Legal Department',       icon:'fa-scale-balanced',categories:['Legal & Compliance Services']},
  {id:'DD',  name:'Drug Discovery',         icon:'fa-flask',         categories:['Active Pharmaceutical Ingredients & Raw Materials','Lab Equipment & Reagents']},
  {id:'RD',  name:'R&D Department',         icon:'fa-microscope',    categories:['Lab Equipment & Reagents','IT Hardware & Software']},
  {id:'FIN', name:'Finance & Accounts',     icon:'fa-coins',         categories:['Legal & Compliance Services','Cloud & SaaS Subscriptions']},
  {id:'OPS', name:'Operations & Facilities',icon:'fa-building',      categories:['Facilities & Office Supplies','Logistics & Packaging']},
  {id:'MFG', name:'Manufacturing & QA',     icon:'fa-industry',      categories:['Active Pharmaceutical Ingredients & Raw Materials','Facilities & Office Supplies']},
];

const ALL_CATEGORIES = [...new Set(DEPARTMENTS.flatMap(d=>d.categories))];
const REGULATED_CATEGORY = 'Active Pharmaceutical Ingredients & Raw Materials';
const INSURANCE_REQUIRED_CATEGORIES = ['Lab Equipment & Reagents','Active Pharmaceutical Ingredients & Raw Materials','Logistics & Packaging','Facilities & Office Supplies','IT Hardware & Software'];

const AUTHORITY_LIMITS = {'Team Lead':10000,'Manager':50000,'Director':250000,'VP / Head of Department':1000000};

const VENDOR_SEED = [
  // IT Hardware & Software
  {id:'V01',name:'NexaCore Technologies',category:'IT Hardware & Software',complianceStatus:'Active',certExpiry:'2027-03-01',gstValid:true,bankVerified:true,sanctionsClear:true,insuranceValid:true,contractOnFile:true,esgScore:74,onTimeDelivery:92,qualityReject:1.2,paymentTermsDays:45,avgDeliveryDays:10,unitPrice:850,region:'Domestic',coiFlag:false},
  {id:'V02',name:'Veridian Systems',category:'IT Hardware & Software',complianceStatus:'Active',certExpiry:'2026-08-15',gstValid:true,bankVerified:true,sanctionsClear:true,insuranceValid:true,contractOnFile:true,esgScore:68,onTimeDelivery:88,qualityReject:2.0,paymentTermsDays:30,avgDeliveryDays:14,unitPrice:900,region:'Domestic',coiFlag:false},

const DB = {
  async get(key){ try{ const r = await window.storage.get(key,true); return r? JSON.parse(r.value): null; }catch(e){ return null; } },
  async set(key,val){ try{ await window.storage.set(key, JSON.stringify(val), true); }catch(e){ console.error('storage set failed',key,e); } },
};

let STATE = {
  view:'dashboard', meta:null, vendors:[], budgets:{}, prs:[], selectedPrId:null,
  wizard:null, // {step, form, quotations, selectedVendorId, pr}
  filters:{requestsStatus:'all', requestsDept:'all'},
};

async function loadDB(){
  let meta = await DB.get('meta');
  if(!meta || !meta.seeded){
    const budgets = {}; for(const d of DEPARTMENTS) budgets[d.id] = {total:DEPT_BUDGET_SEED[d.id], remaining:DEPT_BUDGET_SEED[d.id]};
    meta = {seeded:true, nextSeq:1};
    // populate STATE first so the seeding routine (which reuses the normal
    // create-request pipeline) has vendors/budgets/meta to work against
    STATE.meta = meta; STATE.vendors = VENDOR_SEED; STATE.budgets = budgets; STATE.prs = [];
    await DB.set('vendors', VENDOR_SEED);
    await DB.set('budgets', budgets);
    await DB.set('pr-index', []);
    await DB.set('meta', meta);
    await seedSampleRequests();
  }
  STATE.meta = await DB.get('meta');
  STATE.vendors = await DB.get('vendors') || VENDOR_SEED;
  STATE.budgets = await DB.get('budgets') || {};
  const index = await DB.get('pr-index') || [];
  const prs = [];
  for(const id of index){ const pr = await DB.get('pr:'+id); if(pr) prs.push(pr); }
  prs.sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt));
  STATE.prs = prs;
}

function nextPrId(deptId){ const seq = STATE.meta.nextSeq++; return {id:`PR-${deptId}-${String(seq).padStart(4,'0')}`, seq}; }
function nextPoNumber(seq){ return `ARB-PO-2026-${String(seq).padStart(5,'0')}`; }

/* ------------------------------ core engine -------------------------------- */

function pickVendorsForCategory(category){ return STATE.vendors.filter(v=>v.category===category); }

function generateQuotations(pr){
  const vendors = pickVendorsForCategory(pr.category);
  return vendors.map(v=>{
    // small deterministic-ish variance per vendor so prices aren't perfectly flat
    const seedNum = (v.id.charCodeAt(1)+v.id.charCodeAt(2)+pr.quantity) % 13;
    const variance = (seedNum-6)/100; // -6%..+6%
    const unit = v.unitPrice * (1+variance);
    const total = Math.round(unit * pr.quantity);
    const deliveryDate = new Date(Date.now() + v.avgDeliveryDays*86400000);
    return {vendor:v, unit:Math.round(unit), total, deliveryDays:v.avgDeliveryDays, deliveryDate};
  }).sort((a,b)=>a.total-b.total);
}

function findDuplicate(pr){
  const cutoff = Date.now() - 30*86400000;
  return STATE.prs.some(p=> p.deptId===pr.deptId && p.category===pr.category && p.item.trim().toLowerCase()===pr.item.trim().toLowerCase() && new Date(p.createdAt).getTime()>=cutoff);
}

function runValidation(pr, quotation, deptBudget){
  const ctx = {
    pr, vendor:quotation.vendor, quotations: pr._allQuotes, total: quotation.total,
    deptBudget, today:new Date(), reqDate:new Date(pr.requiredByDate), deliveryDate:quotation.deliveryDate,
    duplicateFound: findDuplicate(pr),
  };
  const results = CHECK_DEFS.map(def=>{ const r = def.eval(ctx); return {id:def.id, group:def.group, name:def.name, critical:def.critical, status:r.status, note:r.note}; });
  const criticalFails = results.filter(r=>r.critical && r.status==='fail');
  const otherIssues = results.filter(r=> r.status==='warning' || (r.status==='fail' && !r.critical));
  let decision, confidence;
  if(criticalFails.length>0){ decision='rejected'; confidence = Math.max(55, 92 - criticalFails.length*14 - otherIssues.length*2); }
  else if(otherIssues.length===0){ decision='approved'; confidence = 97; }
  else { decision='manual_review'; confidence = Math.max(58, 90 - otherIssues.length*5); }
  return {results, decision, confidence, criticalFails, otherIssues};
}

function buildReasoning(validation, pr, vendor){
  const {decision, criticalFails, otherIssues} = validation;
  if(decision==='approved'){
    return `All 25 validation checks passed. ${vendor.name} is a pre-approved, fully compliant vendor and the quotation is within budget, policy, and delegated authority. Zathura.AI has auto-approved this requisition and synced it to SAP Ariba as an issued purchase order.`;
  }
  if(decision==='rejected'){
    const names = criticalFails.map(c=>c.name).join('; ');
    return `${criticalFails.length} critical compliance gate${criticalFails.length>1?'s':''} failed: ${names}. Critical gates cannot be waived by the agent, so Zathura.AI has auto-rejected this requisition and returned it to ${DEPARTMENTS.find(d=>d.id===pr.deptId).name} with the findings above. ${otherIssues.length? `An additional ${otherIssues.length} non-critical issue${otherIssues.length>1?'s were':' was'} also flagged.`:''}`;
  }
  const names = otherIssues.map(c=>c.name).join('; ');
  return `No critical compliance gates failed, but ${otherIssues.length} check${otherIssues.length>1?'s':''} returned a warning or non-critical fail: ${names}. These fall outside the agent's auto-approval confidence threshold, so Zathura.AI has routed this requisition to the Procurement team's manual review queue with the full checklist and reasoning attached.`;
}

async function createAndPersistPR(form, opts={}){
  const dept = DEPARTMENTS.find(d=>d.id===form.deptId);
  const reqDate = new Date(Date.now() + form.daysFromNow*86400000);
  const pr = {
    deptId:form.deptId, category:form.category, item:form.item, quantity:form.quantity, budget:form.budget,
    requiredByDate: reqDate.toISOString(), urgency:form.urgency, requestorLevel:form.requestorLevel,
    requestedBy: form.requestedBy || `${dept.name} Lead`, justification:form.justification||'', regulatorySignoff: !!form.regulatorySignoff,
    crossDept: !!form.crossDept, createdAt: new Date().toISOString(),
  };
  const {id, seq} = nextPrId(form.deptId);
  pr.id = id;
  const quotes = generateQuotations(pr);
  pr._allQuotes = quotes;
  const chosen = typeof form.pickVendorIdx==='number' ? quotes[Math.min(form.pickVendorIdx,quotes.length-1)] : quotes[0];
  const budgets = STATE.budgets;
  const deptBudget = budgets[form.deptId];
  const validation = runValidation(pr, chosen, deptBudget);
  const poNumber = nextPoNumber(seq);
  const reasoning = buildReasoning(validation, pr, chosen.vendor);

  const finalPr = {
    ...pr,
    poNumber,
    quotations: quotes.map(q=>({vendorId:q.vendor.id, vendorName:q.vendor.name, unit:q.unit, total:q.total, deliveryDays:q.deliveryDays, deliveryDate:q.deliveryDate.toISOString()})),
    recommendedVendorId: chosen.vendor.id,
    recommendedTotal: chosen.total,
    checklist: validation.results,
    aiDecision: validation.decision,
    aiConfidence: validation.confidence,
    reasoning,
    status: validation.decision, // 'approved' | 'rejected' | 'manual_review'
    manualResolution: null,
    auditTrail: [
      {time:new Date().toISOString(), actor:`${pr.requestedBy} (${dept.name})`, action:'Procurement request raised', note:`${pr.item} — qty ${pr.quantity}, budget ${fmtMoney(pr.budget)}.`},
      {time:new Date().toISOString(), actor:'Zathura.AI', action:'Vendor quotations generated', note:`${quotes.length} quotations retrieved from the pre-approved vendor master for "${pr.category}".`},
      {time:new Date().toISOString(), actor:'Zathura.AI', action:'Synced to SAP Ariba', note:`Purchase requisition recorded in Ariba as ${poNumber}.`},
      {time:new Date().toISOString(), actor:'Zathura.AI', action:`25-point validation complete — ${labelForDecision(validation.decision)}`, note:reasoning},
    ],
  };
  if(validation.decision==='approved'){ deptBudget.remaining = Math.max(0, deptBudget.remaining - chosen.total); }

  await DB.set('pr:'+id, finalPr);
  const index = await DB.get('pr-index') || [];
  index.push(id);
  await DB.set('pr-index', index);
  await DB.set('budgets', budgets);
  await DB.set('meta', STATE.meta);
  if(!opts.silent){ STATE.prs.unshift(finalPr); }
  return finalPr;
}

function labelForDecision(d){ return d==='approved'?'Auto-Approved': d==='rejected'?'Auto-Rejected':'Sent for Manual Review'; }

/* --------------------------------- UI shell -------------------------------- */

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function statusBadge(status){
  const map = {approved:['b-success','fa-circle-check','Approved'], rejected:['b-danger','fa-circle-xmark','Rejected'], manual_review:['b-warning','fa-circle-exclamation','Manual Review']};
  const [cls,icon,label] = map[status] || ['b-neutral','fa-circle','—'];
  return `<span class="badge ${cls}"><i class="fa-solid ${icon}"></i>${label}</span>`;
}
function manualBadge(res){
  if(!res) return '';
  const map = {approved:['b-success','fa-user-check','Approved by reviewer'], rejected:['b-danger','fa-user-xmark','Rejected by reviewer']};
  const [cls,icon,label] = map[res] || [];
  return `<span class="badge ${cls}"><i class="fa-solid ${icon}"></i>${label}</span>`;
}

function toast(msg, icon='fa-check'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div'); el.className='toast';
  el.innerHTML = `<i class="fa-solid ${icon}"></i><span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 3200);
}

function navItems(){

function bindGlobalEvents(){
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{ STATE.view = el.dataset.nav; STATE.wizard=null; render(); });
  });
  const reset = document.getElementById('resetDemo');
  if(reset) reset.addEventListener('click', async ()=>{
    if(!confirm('This clears the shared workspace (all requests, budgets) for everyone using this app and reseeds sample data. Continue?')) return;
    await DB.set('meta', {seeded:false});
    await loadDB(); STATE.view='dashboard'; render(); toast('Workspace reset and reseeded.');

}

  if(get('f-crossdept')) w.form.crossDept = get('f-crossdept').checked;
  if(get('f-item')) w.form.item = get('f-item').value;
  if(get('f-qty')) w.form.quantity = Math.max(1, parseInt(get('f-qty').value||'1'));
  if(get('f-budget')) w.form.budget = parseFloat(get('f-budget').value||'0');
  if(get('f-date')) w.form.requiredByDate = get('f-date').value;
  if(get('f-urgency')) w.form.urgency = get('f-urgency').value;
  if(get('f-reqby')) w.form.requestedBy = get('f-reqby').value;
  if(get('f-level')) w.form.requestorLevel = get('f-level').value.split(' (')[0];
  if(get('f-justification')) w.form.justification = get('f-justification').value;
  const reg = get('f-regulatory'); if(reg) w.form.regulatorySignoff = reg.checked;
}

function bindNewRequestEvents(){
  const w = STATE.wizard;
  const deptSel = document.getElementById('f-dept');
  const catSel = document.getElementById('f-category');
  const crossDept = document.getElementById('f-crossdept');
  function refreshCategoryOptions(){
    const dept = DEPARTMENTS.find(d=>d.id===deptSel.value);
    const opts = (crossDept.checked? ALL_CATEGORIES : dept.categories);
    catSel.innerHTML = opts.map(c=>`<option>${c}</option>`).join('');
    refreshRegulatoryBox();
  }
  function refreshRegulatoryBox(){
    const wrap = document.getElementById('f-regulatory-wrap');
    if(catSel.value===REGULATED_CATEGORY){
      wrap.innerHTML = `<div class="checkbox-row" style="margin-bottom:16px; border-color:var(--warning-line); background:var(--warning-bg);">
        <input type="checkbox" id="f-regulatory">
        <div><div class="ct">QA / Regulatory sign-off obtained</div><div class="cd">Required for controlled raw material / API procurement before Zathura.AI can clear this requisition.</div></div>
      </div>`;
    } else wrap.innerHTML='';
  }
  if(deptSel) deptSel.addEventListener('change', refreshCategoryOptions);
  if(crossDept) crossDept.addEventListener('change', refreshCategoryOptions);
  if(catSel) catSel.addEventListener('change', refreshRegulatoryBox);
  if(catSel) refreshRegulatoryBox();

  const toStep2 = document.getElementById('toStep2');
  if(toStep2) toStep2.addEventListener('click', ()=>{
    syncWizardFormFromDOM();
    const f = w.form;
    if(!f.item.trim()) return toast('Please describe the item or service needed.','fa-circle-exclamation');
    if(!f.budget || f.budget<=0) return toast('Please enter an approved budget.','fa-circle-exclamation');
    if(!f.requiredByDate) return toast('Please choose a required-by date.','fa-circle-exclamation');
    if(!f.requestedBy.trim()) return toast('Please enter the requestor name.','fa-circle-exclamation');
    const prDraft = {deptId:f.deptId, category:f.category, item:f.item, quantity:f.quantity, requiredByDate:new Date(f.requiredByDate).toISOString(), budget:f.budget, urgency:f.urgency};
    const quotes = generateQuotations(prDraft);
    if(quotes.length===0) return toast('No pre-approved vendors found for this category.','fa-circle-exclamation');
    w.quotes = quotes;
    w.selectedVendorId = quotes[0].vendor.id; // lowest cost pre-selected
    w.step = 2;
    render();
  });

  document.querySelectorAll('.quote-card').forEach(el=>{
    el.addEventListener('click', ()=>{ w.selectedVendorId = el.dataset.vendor; render(); });
  });
  const backStep1 = document.getElementById('backStep1'); if(backStep1) backStep1.addEventListener('click', ()=>{ w.step=1; render(); });
  const toStep3 = document.getElementById('toStep3'); if(toStep3) toStep3.addEventListener('click', ()=>{
    w.step = 3; w.poNumberPreview = nextPoNumber(STATE.meta.nextSeq);
    render();
  });

  const backStep2 = document.getElementById('backStep2'); if(backStep2) backStep2.addEventListener('click', ()=>{ w.step=2; render(); });
  const runBtn = document.getElementById('runAgentBtn');
  if(runBtn) runBtn.addEventListener('click', async ()=>{
    runBtn.disabled = true; runBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>Running validation...';
    document.getElementById('stepNav').querySelector('#backStep2').style.display='none';
    const dept = DEPARTMENTS.find(d=>d.id===w.form.deptId);
    const f = w.form;
    const prDraft = {deptId:f.deptId, category:f.category, item:f.item, quantity:f.quantity, requiredByDate:new Date(f.requiredByDate).toISOString(), budget:f.budget, urgency:f.urgency, requestorLevel:f.requestorLevel, justification:f.justification, regulatorySignoff:f.regulatorySignoff, crossDept:f.crossDept};
    prDraft._allQuotes = w.quotes;
    const chosen = w.quotes.find(q=>q.vendor.id===w.selectedVendorId);
    const deptBudget = STATE.budgets[f.deptId];
    const validation = runValidation(prDraft, chosen, deptBudget);

    const consoleHtml = `
      <div class="console">
        <div class="console-head"><div class="console-dot"></div><div class="console-title">zathura-agent · 25-point validation</div><div class="console-sub">${dept.name} → ${esc(chosen.vendor.name)}</div></div>
        <div class="console-progress"><div class="console-progress-bar" id="progBar"></div></div>
        ${validation.results.map((r,i)=>checkRowHtml(r,i)).join('')}
      </div>`;
    document.getElementById('consoleWrap').innerHTML = consoleHtml;
    requestAnimationFrame(()=>{ document.getElementById('progBar').style.width='100%'; });

    const totalDelay = CHECK_DEFS.length*70 + 700;
    setTimeout(async ()=>{
      const reasoning = buildReasoning(validation, prDraft, chosen.vendor);
      const {id, seq} = nextPrId(f.deptId);
      const poNumber = nextPoNumber(seq);
      const finalPr = {
        ...prDraft, id, poNumber,
        requestedBy: f.requestedBy, createdAt: new Date().toISOString(),
        quotations: w.quotes.map(q=>({vendorId:q.vendor.id, vendorName:q.vendor.name, unit:q.unit, total:q.total, deliveryDays:q.deliveryDays, deliveryDate:q.deliveryDate.toISOString()})),
        recommendedVendorId: chosen.vendor.id, recommendedTotal: chosen.total,
        checklist: validation.results, aiDecision: validation.decision, aiConfidence: validation.confidence,
        reasoning, status: validation.decision, manualResolution:null,
        auditTrail:[
          {time:new Date().toISOString(), actor:`${f.requestedBy} (${dept.name})`, action:'Procurement request raised', note:`${f.item} — qty ${f.quantity}, budget ${fmtMoney(f.budget)}.`},
          {time:new Date().toISOString(), actor:'Zathura.AI', action:'Vendor quotations generated', note:`${w.quotes.length} quotations retrieved from the pre-approved vendor master for "${f.category}".`},
          {time:new Date().toISOString(), actor:'Zathura.AI', action:'Synced to SAP Ariba', note:`Purchase requisition recorded in Ariba as ${poNumber}, status Pending Approval.`},
          {time:new Date().toISOString(), actor:'Zathura.AI', action:`25-point validation complete — ${labelForDecision(validation.decision)}`, note:reasoning},
        ],
      };
      delete finalPr._allQuotes;
      if(validation.decision==='approved'){ deptBudget.remaining = Math.max(0, deptBudget.remaining-chosen.total); }
      await DB.set('pr:'+id, finalPr);
      const index = await DB.get('pr-index') || []; index.push(id); await DB.set('pr-index', index);
      await DB.set('budgets', STATE.budgets); await DB.set('meta', STATE.meta);
      STATE.prs.unshift(finalPr);

      w.finalPr = finalPr; w.step = 4;
      render();
      toast(decisionToast(validation.decision), decisionIcon(validation.decision));
    }, totalDelay);
  });

  const newAnother = document.getElementById('newAnother'); if(newAnother) newAnother.addEventListener('click', ()=>{ initWizard(); render(); });
  const viewFullDetail = document.getElementById('viewFullDetail'); if(viewFullDetail) viewFullDetail.addEventListener('click', ()=>{ STATE.selectedPrId = w.finalPr.id; STATE.view='detail'; STATE.wizard=null; render(); });
}

function decisionIcon(d){ return d==='approved'?'fa-circle-check': d==='rejected'?'fa-circle-xmark':'fa-user-shield'; }

}

async function resolveManual(id, resolution, comment){
  const pr = STATE.prs.find(p=>p.id===id) || await DB.get('pr:'+id);
  pr.manualResolution = resolution;
  pr.auditTrail.push({time:new Date().toISOString(), actor:'Procurement Team', action:`Manually ${resolution}`, note: comment || `Reviewer ${resolution} this requisition after evaluating Zathura.AI's flagged issues.`});
  if(resolution==='approved'){ const b = STATE.budgets[pr.deptId]; b.remaining = Math.max(0, b.remaining - pr.recommendedTotal); await DB.set('budgets', STATE.budgets); }
  await DB.set('pr:'+id, pr);
  const idx = STATE.prs.findIndex(p=>p.id===id); if(idx>=0) STATE.prs[idx]=pr;
  toast(`Requisition ${resolution} by procurement team.`, resolution==='approved'?'fa-circle-check':'fa-circle-xmark');
  render();
}

  }).join('');
  return `
    <div class="page-head"><div><div class="eyebrow"><i class="fa-solid fa-store"></i> Pre-Approved Suppliers</div><h1>Vendor master list</h1><p>The organization-approved vendor pool Zathura.AI sources quotations from for every procurement category.</p></div></div>
    ${sections}
  `;
}

/* --------------------------------- init -------------------------------- */

(async function init(){
  document.getElementById('app').innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100vh; width:100%; color:var(--muted); font-size:14px;"><i class="fa-solid fa-spinner fa-spin" style="margin-right:10px;"></i>Loading Zathura.AI procurement workspace...</div>`;
  await loadDB();
  render();
})();
</script>
